repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: check-yaml
            args: ['--allow-multiple-documents']
          - id: check-json
            # Exclude JSONC files (JSON with Comments) as they need comment support
            exclude: "tsconfig.*\\.json|package-lock\\.json|biome\\.jsonc"
          - id: check-toml
          - id: check-xml
          - id: end-of-file-fixer
            exclude: "package-lock\\.json|^\\.idea/|^logs/"
          - id: trailing-whitespace
            exclude: "package-lock\\.json|^\\.idea/"
          - id: check-added-large-files
            args: ['--maxkb=1000']
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: detect-private-key
          - id: mixed-line-ending
            args: ['--fix=lf']

    - repo: local
      hooks:
          - id: just-fmt
            name: just --fmt
            entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
            language: system
            files: '(?i)(^|/)\.?justfile$|\.just$'
            types: [file]
          - id: prettier
            name: prettier
            entry: vp exec prettier --write
            language: system
            types_or: [yaml, markdown, html]

          - id: oxlint
            name: vp lint
            entry: vp lint --fix
            language: system
            files: \.(js|jsx|ts|tsx|mjs|cjs|mts|cts)$
            types: [file]
